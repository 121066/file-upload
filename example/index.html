<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>文件上传示例</title>
    <style>
        .upload-btn {
            padding: 10px 20px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .result {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #ddd;
        }
    </style>
</head>

<body>
    <button class="upload-btn" onclick="handleUpload()">上传文件</button>
    <div class="result" id="result"></div>

    <script src="../dist/index.umd.js"></script>
    <script>
        async function handleUpload() {
            if (!window.FileUploadHelper || !FileUploadHelper.upload) {
                document.getElementById('result').textContent = '文件上传模块加载失败';
                return;
            }

            try {
                const result = document.getElementById('result');
                const response = await FileUploadHelper.upload(
                    (files, status, errorType) => {
                        if (errorType === 'size') {
                            result.textContent = '文件大小超出限制';
                            return;
                        }

                        if (errorType === 'type') {
                            result.textContent = '文件类型不支持';
                            return;
                        }

                        result.textContent = `上传成功：${files[0].name}`;

                        // 转换为base64
                        FileUploadHelper.uploadBase(files[0]).then(base64 => {
                            console.log('文件base64:', base64.substring(0, 100) + '...');
                        });
                    },
                    {
                        type: ['jpg', 'png', 'pdf'],
                        size: 5 * 1024 * 1024 // 5MB
                    }
                );

                if (response.error) {
                    result.textContent = `上传失败：${response.error}`;
                }
            } catch (error) {
                document.getElementById('result').textContent = `发生错误：${error.message}`;
            }
        }
    </script>
</body>

</html>
